---
Name: silverstripe-laboratory
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - SilverStripe\Laboratory\Extension\TrafficSplitSiteTreeExtension

DNADesign\Elemental\Models\BaseElement:
  extensions:
    - SilverStripe\Laboratory\Extension\VariationIdentifierElementExtension

DNADesign\Elemental\Models\ElementalArea:
  extensions:
    - SilverStripe\Laboratory\Extension\TrafficSplitElementalAreaExtension

SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        LaboratoryTrafficSplitMiddleware: '%$LaboratoryTrafficSplitMiddleware'
  LaboratoryTrafficSplitMiddleware:
    class: 'SilverStripe\Laboratory\Middleware\TrafficSplitMiddleware'
